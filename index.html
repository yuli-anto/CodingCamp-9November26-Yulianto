<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="js/app.js"></script>
  </head>
  <body>

    <!-- Storage Warning Banner (initially hidden) -->
    <div id="storage-warning" class="storage-warning" aria-live="polite" hidden>
      ⚠️ Local storage is unavailable. Your data will not be saved.
    </div>

    <div class="app-container">
      <header class="app-header">
        <h1>Expense &amp; Budget Visualizer</h1>
        <!-- Theme Toggle -->
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light mode" type="button">
          🌙 Dark Mode
        </button>
      </header>

      <main class="main-content">

        <!-- Balance Display -->
        <section id="balance-display" class="balance-display" aria-label="Total balance">
          <h2>Total Balance</h2>
          <span id="balance-amount" class="balance-amount">$0.00</span>
          <div class="spending-limit-section">
            <label for="spending-limit-input">Spending Limit:</label>
            <input
              id="spending-limit-input"
              type="number"
              min="0.01"
              max="999999999.99"
              step="0.01"
              placeholder="Set limit..."
              aria-label="Set spending limit"
            />
          </div>
        </section>

        <!-- Transaction Input Form -->
        <section class="form-section" aria-label="Add transaction">
          <h2>Add Transaction</h2>
          <form id="transaction-form" novalidate>
            <div class="form-group">
              <label for="item-name">Item Name</label>
              <input
                id="item-name"
                type="text"
                maxlength="100"
                placeholder="e.g. Grocery shopping"
                autocomplete="off"
                aria-required="true"
              />
            </div>
            <div class="form-group">
              <label for="amount">Amount</label>
              <input
                id="amount"
                type="number"
                step="0.01"
                min="0.01"
                max="999999999.99"
                maxlength="13"
                placeholder="e.g. 12.50"
                aria-required="true"
              />
            </div>
            <div class="form-group">
              <label for="category">Category</label>
              <select id="category" aria-required="true">
                <option value="" disabled selected>-- Select a category --</option>
              </select>
            </div>
            <span id="form-error" class="form-error" role="alert" aria-live="assertive"></span>
            <button id="add-btn" type="submit" class="btn btn-primary">Add Transaction</button>
          </form>
        </section>

        <!-- Transaction List -->
        <section class="transaction-section" aria-label="Transaction list">
          <div class="transaction-header">
            <h2>Transactions</h2>
            <!-- Sort Controls -->
            <div id="sort-controls" class="sort-controls" role="group" aria-label="Sort transactions">
              <span class="sort-label">Sort by:</span>
              <button class="sort-btn" data-criterion="default" type="button">Default</button>
              <button class="sort-btn" data-criterion="amount-asc" type="button">Amount ↑</button>
              <button class="sort-btn" data-criterion="amount-desc" type="button">Amount ↓</button>
              <button class="sort-btn" data-criterion="category-asc" type="button">Category A–Z</button>
            </div>
          </div>
          <ul id="transaction-list" class="transaction-list" aria-label="Transaction items">
            <!-- Transactions rendered here by JS -->
          </ul>
        </section>

        <!-- Pie Chart -->
        <section class="chart-section" aria-label="Spending by category chart">
          <h2>Spending by Category</h2>
          <div class="chart-wrapper">
            <canvas id="pie-chart" role="img" aria-label="Pie chart of spending by category"></canvas>
            <p id="chart-empty-msg" class="chart-empty-msg">No spending data yet. Add a transaction to see the chart.</p>
          </div>
        </section>

        <!-- Category Manager -->
        <section class="category-section" aria-label="Category manager">
          <h2>Manage Categories</h2>
          <div class="category-form">
            <label for="custom-category-input">New Category Name</label>
            <input
              id="custom-category-input"
              type="text"
              maxlength="50"
              placeholder="e.g. Health"
              autocomplete="off"
              aria-label="New custom category name"
            />
            <button id="add-category-btn" type="button" class="btn btn-secondary">Add Category</button>
          </div>
          <span id="category-error" class="category-error" role="alert" aria-live="assertive"></span>
        </section>

      </main>
    </div>

  </body>
</html>
